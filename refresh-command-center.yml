name: Refresh command center

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: write

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch && github.repository_owner == 'zyadmohamedse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate the graphics
        run: node scripts/refresh-console.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
      - name: Commit updated graphics
        run: |
          if git diff --quiet -- assets/command-center.svg assets/activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/command-center.svg assets/activity.svg
          git commit -m 'Refresh command center stats'
          git push
